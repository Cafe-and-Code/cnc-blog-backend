# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Blog.API

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: Apply appsettings
      run: |
        Copy-Item -Path "C:/secret_config/Blog.API/appsettings.json" -Destination "./Blog.API/appsettings.json"
        Remove-Item -Path "./Blog.API/appsettings.Development.json" -Force
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: |
        cd Blog.API
        dotnet restore
    - name: Build
      run: |
        cd Blog.API
        dotnet build --configuration Release
        dotnet publish -c release -o ./publish
    - name: Test
      run: |
        cd Blog.API
        dotnet test --no-build --verbosity normal

  migrate:
    runs-on: self-hosted
    needs: build
    steps:
    - name: Read connection string from appsettings.json and migrate database
      run: |
        cd Blog.API
        $appSettings = Get-Content -Raw -Path "./appsettings.json" | ConvertFrom-Json
        $connectionString = $appSettings.ConnectionStrings.DefaultConnection
        $escapedString = $connectionString -replace '"','\"'
        dotnet ef database update --connection "$escapedString"
      shell: powershell
        
  deploy:
    runs-on: self-hosted
    needs: migrate
    steps:
    - name: Kill processes
      run: |
        echo "Stopping processes that might be using the files..."
        handle.exe C:\inetpub\wwwroot\apitesting.cafencode.ddns.net | ForEach-Object {
          if ($_ -match 'pid: (\d+)') {
            $pid = $matches[1]
            taskkill /PID $pid /F
          }
        }
    - name: Deploy
      run: |
        cd Blog.API
        echo "Copying files to the web root..."
        robocopy ./publish "C:\inetpub\wwwroot\apitesting.cafencode.ddns.net" /E /Z
        $robocopyExitCode = $LASTEXITCODE
        if ($robocopyExitCode -ge 8) { echo "File copy failed with exit code $robocopyExitCode"; exit $robocopyExitCode }
        echo "Complete Copy files to the web root."
        exit 0
